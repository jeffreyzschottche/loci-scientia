<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AITJE Offline Map</title>
    <link rel="stylesheet" href="maplibre-gl.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b1120;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      .offline-overlay {
        position: absolute;
        z-index: 10;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fcd34d;
        background: rgba(15, 23, 42, 0.8);
        padding: 24px;
      }
      #markers-popup {
        position: absolute;
        right: 12px;
        bottom: 12px;
        min-width: 220px;
        max-width: 320px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #1f2937;
        border-radius: 12px;
        color: #f8fafc;
        padding: 12px 16px;
        font-size: 13px;
        display: none;
      }
      #markers-popup strong {
        display: block;
        font-size: 14px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="markers-popup"></div>
    <div id="offline-status" class="offline-overlay">
      Offline kaartbestand niet gevonden of ongeldig.
    </div>
    <script src="maplibre-gl.js"></script>
    <script src="pmtiles.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      let map;
      let markers = [];
      let bridge;
      let pmtilesProtocol;

      function resetMap(style) {
        if (!map) {
          map = new maplibregl.Map({
            container: "map",
            style,
            attributionControl: false,
            interactive: true,
          });
          map.addControl(new maplibregl.NavigationControl());
          map.on("load", () => {
            markers.forEach((marker) => addMarker(marker));
          });
        } else {
          map.setStyle(style);
        }
      }

      function addMarker(marker) {
        const el = document.createElement("div");
        el.style.width = "16px";
        el.style.height = "16px";
        el.style.borderRadius = "50%";
        el.style.border = "2px solid #0f172a";
        el.style.background = "#10b981";
        el.style.cursor = "pointer";
        el.dataset.markerId = marker.id;
        el.addEventListener("click", () => {
          if (bridge) {
            bridge.handleMarkerClick(marker.id);
          }
          showPopup(marker);
        });
        const mapMarker = new maplibregl.Marker(el).setLngLat([
          marker.longitude,
          marker.latitude,
        ]);
        mapMarker.addTo(map);
      }

      function showPopup(marker) {
        const popup = document.getElementById("markers-popup");
        popup.innerHTML = `<strong>${marker.label}</strong>${marker.coordinates}`;
        popup.style.display = "block";
        setTimeout(() => {
          popup.style.display = "none";
        }, 4000);
      }

      window.updateMap = function (config) {
        const overlay = document.getElementById("offline-status");
        if (!config.tile || !config.tile.valid) {
          overlay.style.display = "flex";
          return;
        }
        overlay.style.display = "none";
        const style = config.style;
        const pmtilesUrl = `${config.tileBase}/${config.tile.file}`;

        if (!pmtilesProtocol) {
          pmtilesProtocol = new pmtiles.Protocol();
          maplibregl.addProtocol("pmtiles", pmtilesProtocol.tile);
        }
        pmtilesProtocol.config.cache = new pmtiles.SharedPromiseCache(6);
        pmtilesProtocol.config.resolved = new pmtiles.ResolvedValueCache();

        style.sources["pmtiles-source"].url = `pmtiles://${pmtilesUrl}`;
        style.center = config.center || [5.2913, 52.1326];
        style.zoom = config.zoom || 5.7;
        resetMap(style);

        markers = config.markers || [];
        if (map && map.isStyleLoaded()) {
          markers.forEach(addMarker);
        } else if (map) {
          map.once("load", () => markers.forEach(addMarker));
        }
      };

      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.Bridge;
        bridge.requestConfig();
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Loci Offline Kaart</title>
    <link rel="stylesheet" href="../frontend/assets/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .offline-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #fcd34d;
        background: rgba(2, 6, 23, 0.9);
        padding: 24px;
        font-size: 15px;
        gap: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="offline-status" class="offline-overlay">
      De offline kaart is nog niet klaar. Start de pmtiles-server en ververs deze pagina.
    </div>
    <script src="../frontend/assets/maplibre-gl.js"></script>
    <script src="../frontend/assets/pmtiles.js"></script>
    <script>
      const overlay = document.getElementById("offline-status");
      const pmtilesUrl = "pmtiles://localhost:8080/europe.pmtiles";

      function showOverlay(message) {
        overlay.textContent = message;
        overlay.style.display = "flex";
      }

      function hideOverlay() {
        overlay.style.display = "none";
      }

      fetch("./style.json")
        .then((response) => response.json())
        .then((style) => {
          const vectorSource = style.sources?.["pmtiles-source"];
          if (!vectorSource) {
            showOverlay("Ongeldige style.json: geen pmtiles-source.");
            return;
          }
          const protocol = new pmtiles.Protocol();
          maplibregl.addProtocol("pmtiles", protocol.tile);
          protocol.config.cache = new pmtiles.SharedPromiseCache(6);
          protocol.config.resolved = new pmtiles.ResolvedValueCache();
          vectorSource.url = pmtilesUrl;
          style.center = style.center || [10, 50];
          style.zoom = style.zoom || 4.5;
          const map = new maplibregl.Map({
            container: "map",
            style,
            attributionControl: false,
            minZoom: 2,
            maxZoom: 15,
          });
          map.addControl(new maplibregl.NavigationControl());
          map.on("load", () => {
            hideOverlay();
          });
          map.on("error", (event) => {
            console.error(event.error || event);
            showOverlay(
              "De kaartdata kon niet worden geladen. Controleer of pmtiles serve draait op poort 8080."
            );
          });
        })
        .catch((error) => {
          console.error(error);
          showOverlay("Kon de stijl niet laden. Controleer de bestanden in app/offlinemap.");
        });
    </script>
  </body>
</html>
